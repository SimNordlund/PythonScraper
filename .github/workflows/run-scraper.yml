name: Run scraper on Fly

on:
  schedule:
    # GitHub cron is UTC. During Swedish summer time, these are
    # 09:00 and 23:00 in Europe/Stockholm.
    # During Swedish winter time, change this to: "0 8,22 * * *"
    - cron: "0 7,21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pythonscraper-fly-machine
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run scraper Machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl machine run docker.io/simonnordlund/pythonscraper:latest \
            --app pythonscraper \
            --region arn \
            --rm \
            --restart no \
            --vm-memory 2048 \
            --vm-cpus 2 \
            python manage.py scrape_daily