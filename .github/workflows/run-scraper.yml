name: Run scraper on Fly

on:
  schedule:
    # One scheduled run per day: 09:17 Swedish summer time / 08:17 winter time.
    # Shared PostgreSQL limits also cover manual runs and disposable machines.
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pythonscraper-fly-machine
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run scraper Machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail

          run_output="$(flyctl machine run docker.io/simonnordlund/pythonscraper:latest \
            --app pythonscraper \
            --region arn \
            --rm \
            --restart no \
            --vm-memory 2048 \
            --vm-cpus 2 \
            --detach \
            python manage.py scrape_daily)"

          echo "$run_output"

          machine_id="$(echo "$run_output" | awk '/Machine ID:/ {print $3; exit}')"
          if [ -z "$machine_id" ]; then
            echo "Could not find Machine ID in flyctl output" >&2
            exit 1
          fi

          flyctl machine wait "$machine_id" \
            --app pythonscraper \
            --state started \
            --wait-timeout 5m
